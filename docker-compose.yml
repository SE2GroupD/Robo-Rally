version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      # These will be pulled from the VM's .env file
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JWT_ISSUER=${SPRING_JWT_ISSUER}
      - SPRING_JWK_SET_URI=${SPRING_JWK_SET_URI}
      # Update CORS to allow the frontend served from the VM's port 80
      - APP_CORS_ALLOWED_ORIGINS=http://se2-d.compute.dtu.dk
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The frontend needs to point to the backend's public URL
        - VITE_API_BASE_URL=http://se2-d.compute.dtu.dk:8080/api
        - VITE_NEON_AUTH_URL=${VITE_NEON_AUTH_URL}
    ports:
      - "80:80"
    restart: unless-stopped