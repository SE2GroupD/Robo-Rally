version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JWT_ISSUER=${SPRING_JWT_ISSUER}
      - SPRING_JWK_SET_URI=${SPRING_JWK_SET_URI}
      # Update CORS to allow the SECURE frontend origin
      - APP_CORS_ALLOWED_ORIGINS=https://se2-d.compute.dtu.dk
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Point to the secure domain, relying on Nginx to route it to the backend
        - VITE_API_BASE_URL=https://se2-d.compute.dtu.dk/api
        - VITE_NEON_AUTH_URL=${VITE_NEON_AUTH_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/s253875/certs:/etc/nginx/certs:ro
    restart: unless-stopped