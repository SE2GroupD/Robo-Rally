name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Backend CI / check (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests & Checks
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: update 
          SPRING_JWT_ISSUER: ${{ secrets.SPRING_JWT_ISSUER }}
          SPRING_JWK_SET_URI: ${{ secrets.SPRING_JWK_SET_URI }}
          APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: ./mvnw clean test