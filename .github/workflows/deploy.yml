name: Deploy to DTU Server

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d "Robo-Rally" ]; then
              git clone https://github.com/SE2GroupD/Robo-Rally.git
            fi
            
            cd Robo-Rally
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Inject GitHub Secrets into a .env file for Docker Compose
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "SPRING_JWT_ISSUER=${{ secrets.SPRING_JWT_ISSUER }}" >> .env
            echo "SPRING_JWK_SET_URI=${{ secrets.SPRING_JWK_SET_URI }}" >> .env
            echo "VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }}" >> .env
            
            # Stop existing containers, rebuild with new code/env, and start
            docker-compose down
            docker-compose up -d --build