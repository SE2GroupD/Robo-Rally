name: Deploy to DTU Server

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create environment configuration
        run: |
          cat << 'EOF' > .env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_JWT_ISSUER=${{ secrets.SPRING_JWT_ISSUER }}
          SPRING_JWK_SET_URI=${{ secrets.SPRING_JWK_SET_URI }}
          VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }}
          EOF

      - name: Build and deploy containers
        run: |
          docker compose down
          docker compose up -d --build